# Production stack: the app, plus Caddy for automatic HTTPS (free Let's Encrypt certificate).
# Usage on the server:  DOMAIN=yourname.duckdns.org docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    mem_limit: 700m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your DuckDNS (or other) host name}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m

volumes:
  caddy_data:
  caddy_config:
