<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{% block title %}Stock Research{% endblock %}</title>
<style>
  a { color: inherit; }
  @media (max-width: 560px) {
    .hide-sm { display: none !important; }
    .show-sm { display: block !important; }
    .px { padding: 24px 16px !important; }
    .outer { padding: 14px 8px !important; }
    .tile { display: inline-block !important; width: 50% !important; box-sizing: border-box; }
    td.c { padding-left: 6px !important; padding-right: 6px !important; }
    td.c1 { padding-left: 10px !important; }
    td.c4 { padding-right: 10px !important; }
    h1 { font-size: 21px !important; }
  }
  @media (prefers-color-scheme: dark) {
    .bg { background: #0a0a0a !important; }
    .card { background: #171717 !important; border-color: #2e2e2e !important; }
    .tx { color: #fafafa !important; }
    .mu { color: #a3a3a3 !important; }
    .soft { background: #262626 !important; }
    .bd { border-color: #2e2e2e !important; }
    .btn { background: #fafafa !important; color: #0a0a0a !important; }
    .good { color: #34d399 !important; }
    .bad { color: #f87171 !important; }
    .warn { color: #fbbf24 !important; }
  }
</style>
</head>
<body class="bg" style="margin:0;padding:0;background:#f3f4f6;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{% block preheader %}{% endblock %}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="bg" style="background:#f3f4f6;">
<tr><td class="outer" align="center" style="padding:28px 12px;">
  <table role="presentation" width="640" cellpadding="0" cellspacing="0" style="width:100%;max-width:640px;">
    <tr><td style="padding:0 6px 14px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
        <td class="tx" style="font-size:15px;font-weight:600;color:#111827;">Stock Research</td>
        <td class="mu" align="right" style="font-size:12px;color:#6b7280;">{% block kicker %}{% endblock %}</td>
      </tr></table>
    </td></tr>
    <tr><td class="card px" style="background:#ffffff;border:1px solid #e5e7eb;border-radius:16px;padding:34px 34px 30px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#111827;">
      {% block body %}{% endblock %}
    </td></tr>
    <tr><td class="mu" style="padding:18px 8px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#6b7280;">
      <a href="{{ app_url }}" style="color:inherit;">Open the app</a> &middot;
      <a href="{{ app_url }}/track-record" style="color:inherit;">App's track record</a> &middot;
      <a href="{{ app_url }}/how-it-works" style="color:inherit;">How it works</a>
      <br><br>{{ disclaimer }}
    </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
